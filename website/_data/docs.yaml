# ── Database ──────────────────────────────────────────────────────────────────

- title: "Schema Overview"
  slug: schema-overview
  category: Database
  description: "Database tables, relationships, and the allowthem_ prefix."
  content: |
    # Schema Overview

    allowthem uses SQLite via SQLx. In embedded mode, tables are prefixed with `allowthem_` to avoid collisions. In standalone mode, no prefix is used.

    *Schema documentation coming soon.*

- title: "Migrations"
  slug: migrations
  category: Database
  description: "Running migrations, creating new ones, and the SQLx offline cache."
  content: |
    # Migrations

    Migrations live in `crates/core/migrations/`. Run `just migrate` to apply. After changing queries, run `just sqlx-prepare` to update the offline cache.

