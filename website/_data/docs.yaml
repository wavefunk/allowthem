- title: "JWT Settings"
  slug: jwt-settings
  category: Configuration
  description: "RS256 vs HS256, key management, JWKS endpoint configuration."
  content: |
    # JWT Settings

    Embedded mode uses HS256 (symmetric, integrator-supplied secret). Standalone mode uses RS256 (asymmetric, allowthem manages the keypair and publishes via JWKS).

    *Full reference coming soon.*

- title: "Session Tuning"
  slug: session-tuning
  category: Configuration
  description: "TTL, sliding window, cookie settings, and session storage."
  content: |
    # Session Tuning

    Sessions use SHA-256 hashed tokens stored in the database. Configure TTL, sliding-window renewal, cookie flags (HttpOnly, SameSite, Secure), and maximum concurrent sessions.

    *Full reference coming soon.*

