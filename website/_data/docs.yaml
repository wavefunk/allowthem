# ── Overview ──────────────────────────────────────────────────────────────────

- title: "Overview"
  slug: overview
  category: Overview
  description: "What allowthem is, dual-mode architecture, and when to use each mode."
  content: |
    # Overview

    allowthem is an embeddable authentication system for wavefunk projects. It can run as a Rust library (embedded mode) or as a standalone OIDC provider (external mode). Consuming projects code against an `AuthClient` trait, so switching between modes requires only a configuration change.

    ## Dual-mode architecture

    **Embedded mode** — add `allowthem-core` as a dependency. Tables live in your database with an `allowthem_` prefix. Sessions, passwords, MFA, roles — all managed in-process.

    **Standalone mode** — run the `allowthem` binary as a separate service. It exposes OIDC endpoints, signs RS256 tokens, publishes a JWKS endpoint, and provides an admin UI for user management.

    ## When to use which

    Use embedded mode when you want auth as a library with full control over the database and configuration. Use standalone mode when you need a shared identity provider across multiple services.

# ── Getting Started ───────────────────────────────────────────────────────────

- title: "Quickstart: Embedded"
  slug: quickstart-embedded
  category: Getting Started
  description: "Add allowthem as a library, implement AuthClient, and run."
  content: |
    # Quickstart: Embedded

    Add allowthem to your Axum application as a library dependency.

    ## Install

    ```toml
    [dependencies]
    allowthem-core = "0.1"
    allowthem-server = "0.1"
    ```

    ## Implement AuthClient

    Wire the trait into your application. This gives you login, registration, sessions, and MFA with zero external dependencies.

    *Detailed walkthrough coming soon.*

- title: "Quickstart: Standalone"
  slug: quickstart-standalone
  category: Getting Started
  description: "Run allowthem as a standalone OIDC provider with admin UI."
  content: |
    # Quickstart: Standalone

    Deploy allowthem as its own binary with a built-in admin interface.

    ## Run the server

    ```bash
    cargo run --bin allowthem
    ```

    The server starts on `http://localhost:3000` with login, registration, and admin routes.

