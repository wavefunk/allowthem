{# _application_secret_panel.html — one-time client_secret display.
   Rendered only when `client_secret` is in context (after create or
   regenerate). NEVER rendered on a plain detail-page reload. #}
<div class="wf-flash wf-flash-warn" role="alert">
  <h3>Save this client secret now — it won't be shown again.</h3>
  <pre class="wf-mono"><code id="client-secret">{{ client_secret }}</code></pre>
  <button type="button" class="wf-btn"
          onclick="navigator.clipboard.writeText(document.getElementById('client-secret').innerText)">
    Copy
  </button>
</div>
