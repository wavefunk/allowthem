[package]
name = "allowthem"
version.workspace = true
authors.workspace = true
description = "allowthem server binary"
edition.workspace = true
license-file = "LICENSE"
repository.workspace = true
publish = false

[[bin]]
name = "allowthem"
path = "standalone/main.rs"

[[bin]]
name = "allowthem-saas"
