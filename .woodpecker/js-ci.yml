when:
  - event: push
    branch: master
    path:
      include:
        - packages/js/**
        - .woodpecker/js-ci.yml
  - event: pull_request
    path:
      include:
        - packages/js/**
        - .woodpecker/js-ci.yml
  - event: manual

matrix:
  NODE_VERSION:
    - "18"
    - "20"
    - "22"

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.0
    settings:
      partial: true
      depth: 1
      lfs: false
      recursive: false

steps:
  - name: test-node-${NODE_VERSION}
    image: docker.io/library/node:${NODE_VERSION}-bookworm-slim
    pull: true
    volumes:
      - allowthem-js-ci-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/npm
      - npm config set cache /woodpecker-cache/npm --global
      - cd packages/js
      - npm ci
      - npm run typecheck
      - npm test
      - npm run build
      - npm run size
