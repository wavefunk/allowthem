when:
  - event: tag
    ref: refs/tags/v*

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.0
    settings:
      partial: false
      depth: 0
      lfs: false
      recursive: false

steps:
  - name: verify-release
    image: git.wavefunk.io/wavefunk/ci-rust:nightly-2026-01-05
    pull: true
    environment:
      CARGO_HOME: /woodpecker-cache/cargo
      CARGO_TARGET_DIR: /woodpecker-cache/target
      SCCACHE_DIR: /woodpecker-cache/sccache
    volumes:
      - allowthem-release-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/cargo /woodpecker-cache/target /woodpecker-cache/sccache
      - sh scripts/ci/validate-release-tag.sh
      - cargo fmt --check
      - cargo test --workspace --locked
      - PUBLISH_CRATES_DRY_RUN=true sh scripts/ci/publish-crates.sh

  - name: publish-crates
    image: git.wavefunk.io/wavefunk/ci-rust:nightly-2026-01-05
    pull: true
    depends_on: [verify-release]
    environment:
      CARGO_HOME: /woodpecker-cache/cargo
      CARGO_REGISTRY_TOKEN:
        from_secret: cargo_registry_token
      CARGO_TARGET_DIR: /woodpecker-cache/target
      SCCACHE_DIR: /woodpecker-cache/sccache
    volumes:
      - allowthem-release-cache:/woodpecker-cache
    commands:
      - mkdir -p /woodpecker-cache/cargo /woodpecker-cache/target /woodpecker-cache/sccache
      - sh scripts/ci/publish-crates.sh
